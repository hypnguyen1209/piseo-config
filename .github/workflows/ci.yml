# CI gate for piseo-config: JSON configs must parse, and a fresh clone must
# restore cleanly on a cold runner — byte-for-byte what a new machine gets.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Every committed JSON config must parse
        run: |
          fail=0
          for f in pi/*.json paseo/*.json; do
            echo "checking $f"
            bun -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || fail=1
          done
          exit $fail
      - name: All plugin source submodules must be valid packages matching deps
        run: |
          count="$(git config -f .gitmodules --list | grep -c '.path=')"
          deps="$(bun -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync("pi/packages/package.json","utf8")).dependencies).length)')"
          echo "source submodules: $count | dependencies: $deps"
          [ "$count" -eq "$deps" ]
          for d in $(git config -f .gitmodules --list | grep '.path=' | cut -d= -f2); do
            bun -e 'const [pkg, depsFile] = process.argv.slice(1); const name = JSON.parse(require("fs").readFileSync(pkg, "utf8")).name; const deps = Object.keys(JSON.parse(require("fs").readFileSync(depsFile, "utf8")).dependencies); if (!deps.includes(name)) { console.error("submodule not a dependency:", name); process.exit(1) }' "$d/package.json" pi/packages/package.json || exit 1
          done

  restore-smoke:
    # Fresh clone on a cold CI runner = exactly what a new machine clones.
    # If restore fails or the packages tree is incomplete here, it fails there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Run restore against a cold HOME
        run: bun scripts/restore.ts
      - name: Restored pi tree must be complete (plugins reinstalled from lockfile)
        run: |
          test -f ~/.pi/agent/settings.json
          test -f ~/.pi/agent/models.json
          test -f ~/.pi/agent/models-store.json
          test -f ~/.pi/agent/npm/package.json
          test -f ~/.pi/agent/npm/package-lock.json
          test -d ~/.pi/agent/npm/node_modules/@pify
          count="$(ls ~/.pi/agent/npm/node_modules/@pify | wc -l)"
          echo "@pify packages: $count"
          [ "$count" -eq 20 ]
          test -d ~/.pi/agent/npm/node_modules/pi-mcp-adapter
          test -d ~/.pi/agent/npm/node_modules/pi-web-access
      - name: Paseo configs must be restored
        run: |
          test -f ~/.paseo/config.json
          test -f ~/.paseo/projects/projects.json
      - name: npm lockfile must match package.json (drift check)
        run: npm ci --dry-run --prefix ~/.pi/agent/npm
